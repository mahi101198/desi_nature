name: Content pipeline

# Twice a week: Tuesday and Friday at 06:10 IST (00:40 UTC).
# Drafts and briefs land on a branch with a pull request for the owner to review.
# In the default "review" mode nothing is published by this workflow.
on:
  schedule:
    - cron: "40 0 * * 2,5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run again even if this slot already ran"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Never run two pipelines at once.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Set these as repository variables/secrets. Leaving AI_PROVIDER unset keeps
      # the pipeline in manual mode: it writes briefs and costs nothing.
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'manual' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_WEB_SEARCH: ${{ vars.ANTHROPIC_WEB_SEARCH }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run weekly pipeline
        run: npm run pipeline:weekly -- ${{ inputs.force && '--force' || '' }}
      - name: Validate content
        run: npm run content:validate
      - name: Backlink report
        run: npm run backlinks:report
      - name: Open a pull request with the drafts and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          branch="content/run-$(date -u +%Y%m%d-%H%M)"
          git config user.name "desi-nature-pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git checkout -b "$branch"
          git add content reports
          git commit -m "Content pipeline run $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create --title "Content pipeline $(date -u +%Y-%m-%d): drafts for review" \
            --body "Automated run. Read reports/pipeline for what happened. Drafts are status: draft and are not published. Review each article against its sources, set status to approved with reviewedBy, then run npm run content:publish -- <slug>." \
            --base "${{ github.event.repository.default_branch }}" --head "$branch"
